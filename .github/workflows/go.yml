# The Go client against the binaries it embeds (go/bin) and the shared fixtures and schema. Its types
# are generated from the schema (make types): regenerating them here must change nothing.
# A schema change fails here until a release embeds a binary that prints it: the signal to cut one.
name: go

on:
  push:
    branches: [main]
    paths: ['go/**', 'schema/**', 'test/fixtures/**', 'Makefile', '.github/workflows/go.yml']
  pull_request:
    paths: ['go/**', 'schema/**', 'test/fixtures/**', 'Makefile', '.github/workflows/go.yml']
  # release.yml's push of go/bin starts no workflow (GITHUB_TOKEN); it dispatches this one instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - name: types match the schema
        run: make -C .. -B go/documents.go && git diff --exit-code documents.go
      - run: go vet ./...
      - run: go test ./...
