# A release is one dispatch:
#   gh workflow run release.yml -f version=v0.3.0
# It builds the binaries (c.yml), puts them in go/bin (the Go client embeds them), runs the client's
# tests against them, commits them when their bytes changed, tags the commit vX.Y.Z (the binary) and
# go/vX.Y.Z (the Go module), and publishes the GitHub release.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: vX.Y.Z
        required: true

permissions:
  contents: write

jobs:
  c:
    uses: ./.github/workflows/c.yml
    with: { version: '${{ inputs.version }}' }

  release:
    needs: [c]
    runs-on: ubuntu-24.04
    env: { VERSION: '${{ inputs.version }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: embed, test, commit, tag
        run: |
          cp dist/nvq-linux-amd64 dist/nvq-linux-arm64 go/bin/
          (cd go && go test ./...)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/bin
          git diff --cached --quiet || git commit -m "release $VERSION: embedded binaries"
          git tag "$VERSION" && git tag "go/$VERSION"
          git push origin HEAD:main "$VERSION" "go/$VERSION"
      - name: publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp schema/nvq.schema.json dist/
          gh release create "$VERSION" dist/nvq-linux-* dist/nvq.schema.json --title "$VERSION" --generate-notes
