# nvq itself: the release binaries and the declarations they are built from. Runs when an input of
# either changes, and is the build release.yml calls, so a release ships exactly what this checks.
#
# Built inside manylinux2014 (glibc 2.17), so one binary runs on every Linux an NVIDIA driver runs on.
# JavaScript actions cannot run in that image (their node needs a newer glibc), so the build is a
# plain `docker run` on the host runner.
name: c

on:
  push:
    branches: [main]
    paths: ['src/**', 'schema/**', 'Makefile', 'test/layout.c', '.github/workflows/c.yml']
  pull_request:
    paths: ['src/**', 'schema/**', 'Makefile', 'test/layout.c', '.github/workflows/c.yml']
  workflow_call:
    inputs:
      version:
        description: vX.Y.Z, stamped into the binary; empty stamps the short commit
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, image: quay.io/pypa/manylinux2014_x86_64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux2014_aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: build
        env: { VERSION: '${{ inputs.version }}' }
        run: |
          [[ -n $VERSION ]] || VERSION=$(git rev-parse --short HEAD)
          [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || $GITHUB_EVENT_NAME != workflow_dispatch ]]
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} make release ARCH=${{ matrix.arch }} VERSION="$VERSION"
      - name: glibc 2.17 is the newest symbol it needs
        run: |
          newest=$(objdump -T dist/nvq-linux-${{ matrix.arch }} | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [[ $(printf '%s\nGLIBC_2.17\n' "$newest" | sort -V | tail -1) == GLIBC_2.17 ]]
      - name: smoke
        run: |
          bin=dist/nvq-linux-${{ matrix.arch }}
          $bin version | jq -e '.nvq == 1'
          cmp <($bin schema) schema/nvq.schema.json
          # No NVIDIA driver on a hosted runner: list must say so, as a document, with exit 3.
          set +e; out=$($bin list); code=$?; set -e
          echo "$out"; [[ $code == 3 ]] && jq -e '.error.code == "driver_not_loaded"' <<<"$out"
      - uses: actions/upload-artifact@v7
        with:
          name: nvq-linux-${{ matrix.arch }}
          path: dist/

  # nvq declares the NVML and CUDA slices it uses by hand; this compiles those declarations against
  # NVIDIA's own headers (layouts, constants, every function signature) for the oldest and newest
  # toolkits NVIDIA ships for this runner, so a header change fails here, not on a rig.
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: NVIDIA headers (nvml.h, cuda.h; no driver, no compiler)
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && sudo apt-get update -qq
          # nvml.h is in cuda-nvml-dev, cuda.h in cuda-cudart-dev (cuda-driver-dev is only the stub library).
          sudo apt-get install -y -qq cuda-nvml-dev-12-5 cuda-cudart-dev-12-5 cuda-nvml-dev-12-9 cuda-cudart-dev-12-9 \
            cuda-nvml-dev-13-1 cuda-cudart-dev-13-1 cuda-nvml-dev-13-4 cuda-cudart-dev-13-4
      - run: make layout
